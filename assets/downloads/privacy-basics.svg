<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title description">
  <title id="title">Everyday online privacy basics</title>
  <desc id="description">An infographic reminding readers to share less, review permissions, secure accounts, and update devices.</desc>
  <rect width="900" height="500" rx="26" fill="#100D16"/>
  <rect x="28" y="28" width="844" height="444" rx="20" fill="#211829" stroke="#A952B9" stroke-width="3"/>
  <text x="65" y="105" fill="#f0f7fb" font-family="Arial,sans-serif" font-size="38" font-weight="700">PRIVACY, EVERY DAY</text>
  <text x="65" y="148" fill="#CBBBD1" font-family="Arial,sans-serif" font-size="21">Small choices help keep your information in your control.</text>
  <g fill="#A952B9" font-family="Arial,sans-serif" font-size="25" font-weight="700">
    <text x="80" y="230">01</text><text x="80" y="305">02</text><text x="80" y="380">03</text><text x="80" y="455">04</text>
  </g>
  <g fill="#f0f7fb" font-family="Arial,sans-serif" font-size="24">
    <text x="145" y="230">Share only what is needed</text>
    <text x="145" y="305">Check app permissions and privacy settings</text>
    <text x="145" y="380">Use unique passwords and multi-factor authentication</text>
    <text x="145" y="455">Keep your devices and apps up to date</text>
  </g>
</svg>
